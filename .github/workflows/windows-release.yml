name: Windows x64 build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-2025
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402' # Match the development SDK used to produce a working PRI

      - name: Reject tracked patient data and local secrets
        shell: pwsh
        run: |
          $tracked = @(git ls-files)
          $blocked = @($tracked | Where-Object {
            $_ -match '(?i)(^|/)(captures|recordings|photos)/' -or
            $_ -match '(?i)(^|/)(settings\.json|\.env(?:\..+)?)$' -or
            $_ -match '(?i)\.(dbf|cdx|fpt|mp4|mov|avi|mkv|jpg|jpeg|bmp|pfx|p12|pem|key|zip|7z|sqlite3?)$'
          })
          if ($blocked.Count -gt 0) {
            throw "Tracked patient data / local secrets detected: $($blocked.Count) file(s)."
          }

      - name: Compile WinUI x64
        shell: pwsh
        run: |
          dotnet build .\ClinicCameraCapture.csproj -c Release -r win-x64 --self-contained true `
            -p:Platform=x64 -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false --nologo
          if ($LASTEXITCODE -ne 0) { throw "WinUI x64 build failed." }

      - name: Run synthetic photo and DBF tests
        shell: pwsh
        run: dotnet run --project .\tests\CaptureStore.Smoke\CaptureStore.Smoke.csproj -c Release --no-launch-profile

      - name: Check camera-switch source regression
        shell: pwsh
        run: .\tests\CameraSwitch.Regression.ps1

      - name: Publish self-contained Windows x64 folder
        shell: pwsh
        run: |
          dotnet publish .\ClinicCameraCapture.csproj -c Release -r win-x64 --self-contained true `
            -p:Platform=x64 -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true -p:PublishTrimmed=false `
            -o .\publish\win-x64 --nologo
          if ($LASTEXITCODE -ne 0) { throw "Self-contained publish failed." }

      - name: Validate publish folder and create ZIP
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'publish\win-x64'
          foreach ($required in @('ClinicCameraCapture.exe', 'ClinicCameraCapture.dll',
                                  'hostfxr.dll', 'Microsoft.WindowsAppRuntime.Bootstrap.dll')) {
            if (-not (Test-Path (Join-Path $app $required))) {
              throw "Missing required self-contained publish file: $required"
            }
          }
          $pri = Join-Path $app 'ClinicCameraCapture.pri'
          if (-not (Test-Path $pri)) { throw "WinUI resource index (.pri) missing." }
          $priBytes = (Get-Item $pri).Length
          # Broken v0.6.3 release had an 11,216-byte PRI and crashed on startup
          # with 0xC000027B. A known-good WinUI resource index is ~2.2 MB.
          if ($priBytes -lt 262144) {
            throw "WinUI resource index is abnormally small ($priBytes bytes); blocking release."
          }
          Write-Host "WinUI PRI length: $priBytes bytes"
          $files = @(Get-ChildItem -LiteralPath $app -Recurse -File)
          if ($files.Count -lt 10) { throw "Publish folder looks incomplete." }
          if (@($files | Where-Object {
            $_.Name -match '(?i)^(settings\.json|\.env.*)$' -or
            $_.Extension -match '(?i)^\.(dbf|cdx|fpt|mp4|mov|avi|mkv|jpg|jpeg|bmp|pfx|p12|pem|key)$'
          }).Count -gt 0) { throw "Publish folder contains prohibited patient-data-like files." }
          New-Item -ItemType Directory -Path '.\dist' -Force | Out-Null
          $zip = Join-Path $PWD 'dist\ClinicCameraCapture-win-x64.zip'
          Compress-Archive -Path (Join-Path $app '*') -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "ZIP was not created." }
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            if ($entries -notcontains 'ClinicCameraCapture.exe' -or
                $entries -notcontains 'Microsoft.WindowsAppRuntime.Bootstrap.dll') {
              throw "ZIP root is missing the executable or Windows App SDK bootstrap."
            }
          } finally { $archive.Dispose() }
          $hash = Get-FileHash -Algorithm SHA256 $zip
          "SHA256 $($hash.Hash) ClinicCameraCapture-win-x64.zip" | Set-Content '.\dist\SHA256.txt'
          Write-Host "Packaged $($files.Count) files, $((Get-Item $zip).Length) ZIP bytes."

      - name: Upload downloadable CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinicCameraCapture-win-x64
          path: |
            dist/ClinicCameraCapture-win-x64.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-test-package
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: ClinicCameraCapture-win-x64
          path: dist

      - name: Publish versioned ZIP to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.-]+)?$') {
            throw "Unexpected release tag format."
          }
          $source = Join-Path $PWD 'dist\ClinicCameraCapture-win-x64.zip'
          $target = Join-Path $PWD "dist\ClinicCameraCapture-$tag-win-x64.zip"
          Move-Item -LiteralPath $source -Destination $target
          $checksumPath = Join-Path $PWD 'dist\SHA256.txt'
          if (-not (Test-Path $checksumPath)) { throw "Missing release checksum." }
          $actualHash = (Get-FileHash -Algorithm SHA256 $target).Hash
          "$actualHash  ClinicCameraCapture-$tag-win-x64.zip" | Set-Content -Path $checksumPath -Encoding ascii
          $notes = @'
          Non-clinical preview build / 非臨床測試版

          - Windows 10/11 x64: 下載整個 ZIP，解壓縮後執行 ClinicCameraCapture.exe，不能只複製 EXE。
          - 包含 .NET 與 Windows App SDK self-contained 相依檔案。
          - 自動驗證僅使用合成照片及合成 DBF；沒有任何正式 HIS 或病患資料。
          - 真實診間 USB 相機切換、JPG 實拍、MP4 播放及資料保存流程仍需現場驗收。
          - 不會寫入 HIS 的 CH013M1/CDX/FPT 影像索引；不可視為已完成正式臨床部署。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'clinic-camera-release-notes.md'
          $notes | Set-Content -Path $notesPath -Encoding utf8
          gh release view $tag --repo $env:GH_REPO --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $target $checksumPath --repo $env:GH_REPO --clobber
          } else {
            gh release create $tag $target $checksumPath --repo $env:GH_REPO --verify-tag `
              --title "Clinic Camera Capture $tag (Windows x64 Preview)" `
              --prerelease --notes-file $notesPath
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release upload failed." }
